name: CI - Verificação de Pull Request

on:
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    name: Verificação de Build (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Build
        run: npm run build
